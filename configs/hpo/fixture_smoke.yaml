  modeling_manifest_path_override: data/modeling/datasets/fixture_2013_01_first20/_manifest.json
  baseline_reference_manifest_path_override: null

study:
  name: fixture_validation_hpo
  output_root: data/neural_hpo
  storage_path: data/neural_hpo/studies/fixture_validation_hpo/optuna_study.db
  evaluation_scope: validation_only
  objective_metric: validation.policy.mrr

budget:
