# Sharded ingestion orchestrator config for the full 2017-01 archive.
# `input_path`/`output_root` are placeholders; the orchestrator overrides them
# per shard. HMAC env vars must be set for real-archive anonymization.
input_path: data/raw/lichess_db_standard_rated_2017-01.pgn.zst
output_root: data/processed
source_month: 2017-01
strict: false
require_complete_games: true
batch_games: 10000
max_buffered_records: 500000
parquet_compression: zstd
parquet_row_group_size: 50000
player_hash_mode: hmac_sha256
player_hmac_key_env: CHESSLENS_PLAYER_HMAC_KEY
player_hmac_key_id_env: CHESSLENS_PLAYER_HMAC_KEY_ID

schema_version: 1.1.0
position_normalization_version: fen4_legal_ep_v1
board_encoding_version: board18_abs_v1
action_encoding_version: action8x8x73_v1

# Orchestration-only keys (ignored by the single-dataset ingestion loader).
shard_root: data/raw_shards
collection_root: data/processed/collections
games_per_shard: 250000
expected_raw_games: 10680708
