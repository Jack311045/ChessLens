[project]
name = "chesslens"
version = "0.1.0"
description = "ChessLens Phase 0 and Phase 1.1 foundation: schemas, encodings, and streaming ingestion"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "python-chess>=1.999",
  "zstandard>=0.23.0",
  "numpy>=2.1.0",
  "polars>=1.12.0",
  "pyarrow>=17.0.0",
  "duckdb>=1.1.3",
  "psutil>=6.1.0",
  "PyYAML>=6.0.2",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesslens"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "hypothesis>=6.115.2",
  "ruff>=0.7.2",
  "mypy>=1.13.0",
  "pre-commit>=4.0.1",
  "types-PyYAML>=6.0.12.20250915",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["chess.*", "hypothesis.*", "pyarrow", "pyarrow.*", "duckdb", "psutil"]
ignore_missing_imports = true