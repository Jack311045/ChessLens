name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies from lockfile
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests scripts

      - name: Test
        run: uv run pytest -q tests/unit tests/property tests/integration