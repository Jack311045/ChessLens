name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies from lockfile
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests scripts

      - name: Test
        run: uv run pytest -q tests/unit tests/property tests/integration

      - name: Build fixture ingestion dataset
        shell: bash
        run: |
          mkdir -p data/tmp
          output="$(uv run python -m chesslens.ingestion.run_ingestion --config configs/ingestion/fixture_etl.yaml)"
          echo "$output"

          dataset_path="$(echo "$output" | awk -F= '/^dataset_path=/{print $2}')"
          if [ -z "$dataset_path" ]; then
            echo "Unable to parse dataset_path from ingestion output" >&2
            exit 1
          fi

          echo "CHESSLENS_DATASET_ROOT=$dataset_path" >> "$GITHUB_ENV"
          echo "CHESSLENS_DUCKDB_PATH=data/tmp/chesslens_ci_warehouse.duckdb" >> "$GITHUB_ENV"
          echo "CHESSLENS_DUCKDB_MEMORY_LIMIT=1GB" >> "$GITHUB_ENV"

      - name: Warehouse preflight
        run: uv run python -m chesslens.warehouse.preflight

      - name: dbt debug
        run: uv run dbt debug --project-dir dbt --profiles-dir dbt

      - name: dbt compile
        run: uv run dbt compile --project-dir dbt --profiles-dir dbt

      - name: dbt build
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Build fixture shard collection
        shell: bash
        run: |
          rm -rf data/raw_shards/2013-01 data/processed/collections
          uv run python -m chesslens.ingestion.run_sharding \
            --config configs/sharding/fixture.yaml --resume
          collection_json="$(uv run python -m chesslens.ingestion.run_sharded_ingestion \
            --config configs/ingestion/fixture_sharded.yaml --resume)"
          echo "$collection_json"
          collection_dir="$(echo "$collection_json" | python -c 'import sys, json; print(json.load(sys.stdin)["collection_dir"])')"
          uv run python -m chesslens.ingestion.run_sharded_ingestion \
            --config configs/ingestion/fixture_sharded.yaml --verify-only

          echo "CHESSLENS_COLLECTION_ROOT=$collection_dir" >> "$GITHUB_ENV"
          echo "CHESSLENS_DUCKDB_PATH=data/tmp/chesslens_ci_collection.duckdb" >> "$GITHUB_ENV"

      - name: Collection preflight
        run: uv run python -m chesslens.warehouse.preflight

      - name: Collection dbt build
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Build fixture modeling dataset and verify idempotent reuse
        shell: bash
        run: |
          mkdir -p data/modeling

          first_json="$(uv run python -m chesslens.modeling.build_dataset \
            --config configs/modeling/fixture.yaml \
            --collection-root "$CHESSLENS_COLLECTION_ROOT" \
            --duckdb-path "$CHESSLENS_DUCKDB_PATH" \
            --output-root data/modeling)"
          echo "$first_json"

          first_reused="$(echo "$first_json" | python -c 'import json,sys; print(json.load(sys.stdin)["reused_existing"])')"
          if [ "$first_reused" != "False" ]; then
            echo "Expected first modeling run to build a dataset, got reused_existing=$first_reused" >&2
            exit 1
          fi

          second_json="$(uv run python -m chesslens.modeling.build_dataset \
            --config configs/modeling/fixture.yaml \
            --collection-root "$CHESSLENS_COLLECTION_ROOT" \
            --duckdb-path "$CHESSLENS_DUCKDB_PATH" \
            --output-root data/modeling)"
          echo "$second_json"

          second_reused="$(echo "$second_json" | python -c 'import json,sys; print(json.load(sys.stdin)["reused_existing"])')"
          if [ "$second_reused" != "True" ]; then
            echo "Expected second modeling run to reuse dataset, got reused_existing=$second_reused" >&2
            exit 1
          fi