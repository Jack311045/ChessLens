name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies from lockfile
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests scripts

      - name: Test
        run: uv run pytest -q tests/unit tests/property tests/integration

      - name: Build fixture ingestion dataset
        shell: bash
        run: |
          mkdir -p data/tmp
          output="$(uv run python -m chesslens.ingestion.run_ingestion --config configs/ingestion/fixture_etl.yaml)"
          echo "$output"

          dataset_path="$(echo "$output" | awk -F= '/^dataset_path=/{print $2}')"
          if [ -z "$dataset_path" ]; then
            echo "Unable to parse dataset_path from ingestion output" >&2
            exit 1
          fi

          echo "CHESSLENS_DATASET_ROOT=$dataset_path" >> "$GITHUB_ENV"
          echo "CHESSLENS_DUCKDB_PATH=data/tmp/chesslens_ci_warehouse.duckdb" >> "$GITHUB_ENV"
          echo "CHESSLENS_DUCKDB_MEMORY_LIMIT=1GB" >> "$GITHUB_ENV"

      - name: Warehouse preflight
        run: uv run python -m chesslens.warehouse.preflight

      - name: dbt debug
        run: uv run dbt debug --project-dir dbt --profiles-dir dbt

      - name: dbt compile
        run: uv run dbt compile --project-dir dbt --profiles-dir dbt

      - name: dbt build
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Build fixture shard collection
        shell: bash
        run: |
          rm -rf data/raw_shards/2013-01 data/processed/collections
          uv run python -m chesslens.ingestion.run_sharding \
            --config configs/sharding/fixture.yaml --resume
          collection_json="$(uv run python -m chesslens.ingestion.run_sharded_ingestion \
            --config configs/ingestion/fixture_sharded.yaml --resume)"
          echo "$collection_json"
          collection_dir="$(echo "$collection_json" | python -c 'import sys, json; print(json.load(sys.stdin)["collection_dir"])')"
          uv run python -m chesslens.ingestion.run_sharded_ingestion \
            --config configs/ingestion/fixture_sharded.yaml --verify-only

          echo "CHESSLENS_COLLECTION_ROOT=$collection_dir" >> "$GITHUB_ENV"
          echo "CHESSLENS_DUCKDB_PATH=data/tmp/chesslens_ci_collection.duckdb" >> "$GITHUB_ENV"

      - name: Collection preflight
        run: uv run python -m chesslens.warehouse.preflight

      - name: Collection dbt build
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Build fixture modeling dataset and verify idempotent reuse
        shell: bash
        run: |
          mkdir -p data/modeling

          fixture_provenance_path="data/manifests/fixture_modeling_warehouse_provenance.json"
          uv run python -m chesslens.modeling.generate_warehouse_provenance \
            --collection-root "$CHESSLENS_COLLECTION_ROOT" \
            --duckdb-path "$CHESSLENS_DUCKDB_PATH" \
            --games-relation main.stg_games \
            --move-context-relation main.int_move_context \
            --warehouse-kind fixture \
            --output "$fixture_provenance_path" \
            --allow-overwrite-incompatible

          echo "Fixture warehouse provenance artifact: ${fixture_provenance_path}"
          if [ -z "$fixture_provenance_path" ]; then
            echo "Fixture provenance path is empty" >&2
            exit 1
          fi
          if [ ! -f "$fixture_provenance_path" ]; then
            echo "Fixture provenance artifact not found: $fixture_provenance_path" >&2
            exit 1
          fi
          if [ ! -r "$fixture_provenance_path" ]; then
            echo "Fixture provenance artifact is not readable: $fixture_provenance_path" >&2
            exit 1
          fi

          first_json="$(uv run python -m chesslens.modeling.build_dataset \
            --config configs/modeling/fixture.yaml \
            --collection-root "$CHESSLENS_COLLECTION_ROOT" \
            --duckdb-path "$CHESSLENS_DUCKDB_PATH" \
            --warehouse-provenance-path "$fixture_provenance_path" \
            --output-root data/modeling)"
          echo "$first_json"

          second_json="$(uv run python -m chesslens.modeling.build_dataset \
            --config configs/modeling/fixture.yaml \
            --collection-root "$CHESSLENS_COLLECTION_ROOT" \
            --duckdb-path "$CHESSLENS_DUCKDB_PATH" \
            --warehouse-provenance-path "$fixture_provenance_path" \
            --output-root data/modeling)"
          echo "$second_json"

          FIRST_JSON="$first_json" SECOND_JSON="$second_json" python - <<'PY'
          import json
          import os


          def parse_single_json_env(name: str) -> dict[str, object]:
            text = os.environ.get(name, "")
            if not text.strip():
              raise SystemExit(f"{name} stdout is empty")

            stripped = text.lstrip()
            decoder = json.JSONDecoder()
            try:
              payload, end_index = decoder.raw_decode(stripped)
            except json.JSONDecodeError as exc:
              raise SystemExit(f"{name} stdout is invalid JSON: {exc}") from exc

            if stripped[end_index:].strip():
              raise SystemExit(f"{name} stdout contains trailing non-JSON content")

            if not isinstance(payload, dict):
              raise SystemExit(f"{name} JSON root must be an object")
            return payload


          first = parse_single_json_env("FIRST_JSON")
          second = parse_single_json_env("SECOND_JSON")

          if first.get("reused_existing") is not False:
            raise SystemExit(
              "First modeling run unexpectedly reused an existing dataset "
              f"(reused_existing={first.get('reused_existing')!r})"
            )

          if second.get("reused_existing") is not True:
            raise SystemExit(
              "Second modeling run unexpectedly rebuilt the dataset "
              f"(reused_existing={second.get('reused_existing')!r})"
            )

          first_id = first.get("modeling_dataset_id")
          second_id = second.get("modeling_dataset_id")
          if first_id != second_id:
            raise SystemExit(
              "Modeling dataset IDs differ between runs: "
              f"first={first_id!r}, second={second_id!r}"
            )

          keys_to_match = (
            "collection_id",
            "selected_games",
            "selected_examples",
            "split_counts_games",
            "split_counts_examples",
            "novel_position_test_rows",
          )
          mismatches: list[str] = []
          for key in keys_to_match:
            if first.get(key) != second.get(key):
              mismatches.append(
                f"{key}: first={first.get(key)!r}, second={second.get(key)!r}"
              )

          if mismatches:
            raise SystemExit(
              "Logical modeling counts/metadata differ across idempotent runs: "
              + "; ".join(mismatches)
            )

          print("Modeling idempotency check passed")
          PY